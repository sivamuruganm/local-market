<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Lightbulb body (glass) -->
  <circle cx="100" cy="85" r="35" fill="#ffd700" stroke="#ffb300" stroke-width="2"/>
  
  <!-- Lightbulb filament glow -->
  <circle cx="100" cy="85" r="33" fill="#ffed4e" opacity="0.6"/>
  
  <!-- Filament lines -->
  <path d="M 85 85 Q 100 75 115 85" stroke="#ff9500" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M 85 95 Q 100 105 115 95" stroke="#ff9500" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Bulb base (metal cap) -->
  <rect x="85" y="115" width="30" height="12" fill="#c0c0c0" stroke="#808080" stroke-width="1" rx="2"/>
  
  <!-- Screw threads -->
  <line x1="85" y1="121" x2="115" y2="121" stroke="#999" stroke-width="1" opacity="0.5"/>
  <line x1="85" y1="125" x2="115" y2="125" stroke="#999" stroke-width="1" opacity="0.5"/>
  
  <!-- Base bottom -->
  <ellipse cx="100" cy="127" rx="15" ry="6" fill="#a9a9a9" stroke="#808080" stroke-width="1"/>
  
  <!-- Light rays -->
  <line x1="55" y1="85" x2="35" y2="85" stroke="#ffed4e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="145" y1="85" x2="165" y2="85" stroke="#ffed4e" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <line x1="70" y1="53" x2="55" y2="38" stroke="#ffed4e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="130" y1="53" x2="145" y2="38" stroke="#ffed4e" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Shine highlight -->
  <ellipse cx="90" cy="70" rx="10" ry="12" fill="#ffffff" opacity="0.3"/>
</svg>
