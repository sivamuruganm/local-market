<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Yogurt cup body -->
  <path d="M 60 80 L 70 160 Q 70 170 80 170 L 120 170 Q 130 170 130 160 L 140 80 Z" fill="#f0f8ff" stroke="#4a90e2" stroke-width="2"/>
  
  <!-- Yogurt cup rim -->
  <ellipse cx="100" cy="80" rx="40" ry="12" fill="#ffffff" stroke="#4a90e2" stroke-width="2"/>
  
  <!-- Yogurt inside -->
  <path d="M 62 95 L 70 160 Q 70 168 78 168 L 122 168 Q 130 168 130 160 L 138 95 Z" fill="#f4e4c1"/>
  
  <!-- Yogurt surface -->
  <ellipse cx="100" cy="95" rx="38" ry="10" fill="#ffe8cc" opacity="0.8"/>
  
  <!-- Berries on top -->
  <circle cx="80" cy="85" r="5" fill="#d63384"/>
  <circle cx="90" cy="80" r="5" fill="#ff6b9d"/>
  <circle cx="110" cy="82" r="5" fill="#d63384"/>
  <circle cx="120" cy="88" r="5" fill="#ff6b9d"/>
  
  <!-- Spoon -->
  <rect x="135" y="130" width="6" height="35" fill="#c0c0c0" stroke="#808080" stroke-width="1"/>
  <ellipse cx="138" cy="168" rx="8" ry="6" fill="#d3d3d3" stroke="#808080" stroke-width="1"/>
  
  <!-- Highlight on cup -->
  <ellipse cx="75" cy="110" rx="8" ry="20" fill="#ffffff" opacity="0.4"/>
</svg>