<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Hammer head -->
  <rect x="75" y="50" width="50" height="35" fill="#4a4a4a" stroke="#2a2a2a" stroke-width="2" rx="3"/>
  
  <!-- Hammer face (striking surface) -->
  <rect x="77" y="52" width="46" height="15" fill="#5a5a5a"/>
  
  <!-- Hammer claw -->
  <path d="M 85 85 Q 80 75 75 70" stroke="#4a4a4a" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Hammer handle -->
  <rect x="92" y="85" width="16" height="65" fill="#8b4513" stroke="#654321" stroke-width="1" rx="8"/>
  
  <!-- Handle texture lines -->
  <line x1="92" y1="95" x2="108" y2="95" stroke="#a0522d" stroke-width="1" opacity="0.5"/>
  <line x1="92" y1="110" x2="108" y2="110" stroke="#a0522d" stroke-width="1" opacity="0.5"/>
  <line x1="92" y1="125" x2="108" y2="125" stroke="#a0522d" stroke-width="1" opacity="0.5"/>
  <line x1="92" y1="140" x2="108" y2="140" stroke="#a0522d" stroke-width="1" opacity="0.5"/>
  
  <!-- Handle grip end -->
  <circle cx="100" cy="155" r="10" fill="#6b3410" stroke="#654321" stroke-width="1"/>
  
  <!-- Shine on hammer head -->
  <ellipse cx="85" cy="60" rx="8" ry="5" fill="#ffffff" opacity="0.2"/>
</svg>
