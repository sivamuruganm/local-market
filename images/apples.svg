<svg width="200" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background -->
  <rect width="200" height="200" fill="#f5f5f5"/>
  
  <!-- Apple body -->
  <circle cx="100" cy="110" r="45" fill="#e53935"/>
  
  <!-- Apple top indent -->
  <ellipse cx="100" cy="70" rx="15" ry="8" fill="#c62828"/>
  
  <!-- Apple bottom indent -->
  <ellipse cx="100" cy="150" rx="12" ry="8" fill="#b71c1c"/>
  
  <!-- Stem -->
  <rect x="97" y="60" width="6" height="20" fill="#6d4c41"/>
  
  <!-- Leaf -->
  <ellipse cx="115" cy="72" rx="18" ry="12" fill="#7cb342" transform="rotate(-30 115 72)"/>
  <line x1="115" y1="62" x2="125" y2="80" stroke="#558b2f" stroke-width="1"/>
  
  <!-- Shine/highlight -->
  <ellipse cx="80" cy="95" rx="15" ry="20" fill="#ff7043" opacity="0.6"/>
  <ellipse cx="75" cy="85" rx="8" ry="12" fill="#ffffff" opacity="0.3"/>
  
  <!-- Shadow -->
  <ellipse cx="100" cy="155" rx="40" ry="8" fill="#000000" opacity="0.1"/>
</svg>
